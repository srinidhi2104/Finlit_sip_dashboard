<!DOCTYPE html>

<title>FinLit — Financial Literacy Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf6df;--card:#fffdf2;--ink:#21472f;--muted:#667a63;--line:#d8e6c5;--accent:#4e8b4f;--accent-soft:#e6f3d5;--cream:#f8f2df;--yellow:#fff2bf;--shadow:0 10px 28px rgba(42,78,42,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top right,#dff0c7 0,transparent 28%),radial-gradient(circle at bottom left,#d8edc3 0,transparent 32%),var(--bg);color:var(--ink);font-family:'Nunito Sans',Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #8bcf8f;outline-offset:3px}a{color:inherit}.container{max-width:1180px;margin:auto;padding:20px 24px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.04em;border:0;background:transparent;color:var(--ink);padding:0}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#3c6b42;color:#fff}.nav{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.06em;padding:10px 12px;border-radius:999px}.nav.active{background:var(--accent-soft);color:var(--ink)}nav{display:flex;gap:5px;flex-wrap:wrap}main{padding:38px 0}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}h1,h2,h3{font-family:'Fraunces',serif}h1{font-size:clamp(38px,6vw,62px);line-height:1.01;letter-spacing:-.05em;margin:12px 0 16px}h2{font-size:27px;letter-spacing:-.04em;margin:2px 0 8px}h3{font-size:17px;margin:0 0 8px}p{line-height:1.6}.muted{color:var(--muted)}.small{font-size:12px}.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:14px}.grid{display:grid;gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.btn{border-radius:999px;padding:11px 15px;font-weight:800;border:1.5px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn:hover{border-color:var(--accent)}.btn.primary{background:#3c6b42;color:#fff;border-color:#3c6b42}.btn.green{background:var(--accent);color:#fff;border-color:var(--accent)}.badge{font-size:10px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);font-weight:800;background:#fff}.notice{background:#fff7d9;border-left:5px solid #9ab84e;padding:13px 15px;border-radius:0 12px 12px 0;font-size:12px;line-height:1.6}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;align-items:stretch}.hero-copy{padding:12px 0}.hero-copy p{max-width:560px}.hero-art{background:linear-gradient(180deg,#7ebc71,#4f8b50);color:#fff;border-radius:26px;padding:24px;min-height:255px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.hero-art:after{content:"💰";position:absolute;right:20px;top:12px;font-size:46px}.big{font-size:55px;font-weight:800;letter-spacing:-.06em}.trend{width:100%;height:95px}.trend polyline{fill:none;stroke:#d7efd1;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.kpi strong{display:block;font-size:27px;letter-spacing:-.04em;margin:8px 0 3px}.kpi span{font-size:12px;color:var(--muted)}.bar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) 48px;gap:11px;align-items:center;margin:14px 0;font-size:12px}.track{height:10px;background:#e5decf;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:99px}.path{display:flex;flex-direction:column;text-align:left;min-height:168px;transition:.15s}.path:hover{transform:translateY(-2px)}.path .number{font-size:11px;font-weight:800;color:var(--muted)}.path .arrow{margin-top:auto;font-size:20px}.goals{grid-template-columns:repeat(5,minmax(0,1fr))}.goal{padding:14px;border:1.5px solid var(--line);border-radius:15px;background:#fff;text-align:left;min-height:92px;color:var(--ink);transition:.12s}.goal:hover{border-color:var(--accent)}.goal.active{border:2px solid var(--accent);background:var(--accent-soft)}.goal .icon{font-size:20px;margin-bottom:10px}.goal small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.control-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.value{font-size:24px;font-weight:800;letter-spacing:-.04em}.range{width:100%;accent-color:var(--accent);margin:12px 0}.soft{background:#f4efdf;border-radius:14px;padding:14px}.summary{background:var(--accent-soft);border:1px solid #cfe5bf;border-radius:14px;padding:14px}.calc-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metrics{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px}.metric{background:#f2edde;border-radius:14px;padding:14px}.metric.highlight{background:var(--accent-soft)}.metric .label{font-size:11px;color:var(--muted)}.metric .num{font-size:28px;font-weight:800;letter-spacing:-.04em;margin-top:7px}.canvas-wrap{margin-top:18px;border:1px solid var(--line);border-radius:15px;padding:10px;background:#fff}.canvas-wrap canvas{width:100%;height:235px;display:block}.scroll-cta{text-align:center;margin-top:16px}.categories{grid-template-columns:repeat(3,minmax(0,1fr))}.category{padding:17px;border:1.5px solid var(--line);border-radius:17px;background:#fff}.tag{display:inline-block;background:#f0e9d8;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}.category p{font-size:12px;color:var(--muted);margin:8px 0 10px}.mini{font-size:11px;color:var(--ink);background:#faf6e8;border-radius:10px;padding:9px;margin-bottom:10px}.decision-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.decision{border:1.5px solid var(--line);border-radius:17px;padding:17px;background:#fff}.risk{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:5px 7px;border-radius:999px;background:#f0e9d8;display:inline-block}.checks{grid-template-columns:repeat(5,minmax(0,1fr))}.check{padding:14px;border:1.5px solid var(--line);border-radius:15px;background:#fff;min-height:145px}.check p{font-size:11px;color:var(--muted);margin:0}.apps{grid-template-columns:repeat(3,minmax(0,1fr))}.app{border:1.5px solid var(--line);border-radius:17px;padding:17px;background:#fff}.app.match{border:2px solid var(--accent);background:var(--accent-soft)}.app-head{display:flex;justify-content:space-between;align-items:center}.app-logo{width:38px;height:38px;border-radius:11px;background:#f0e9d8;display:grid;place-items:center;font-weight:800}.app-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quiz{display:grid;gap:14px}.question{border:1.5px solid var(--line);border-radius:15px;padding:15px;background:#fff}.question-title{font-weight:800;margin-bottom:10px}.option-row{display:flex;gap:8px;flex-wrap:wrap}.option{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);text-align:left;flex:1;min-width:180px}.option.selected{border-color:var(--accent);background:var(--accent-soft)}.match-box{display:none;margin-top:14px;background:#f8f2df;border-radius:15px;padding:15px}.match-box.show{display:block}.video-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px}.video-card{border:1.5px solid var(--line);border-radius:15px;padding:15px;background:#fff}.video-card .watch{margin-top:10px}.source{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.learn-card{background:#e6f3d5;border:1px solid #cfe5bf;border-radius:16px;padding:17px}.modal{position:fixed;inset:0;background:rgba(33,71,47,.35);display:grid;place-items:center;padding:20px;z-index:10}.modal.hidden{display:none}.modal-card{width:min(680px,100%);max-height:86vh;overflow:auto;background:#fffdf2;border-radius:20px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.15)}.modal-close{border:1px solid var(--line);background:#fff;border-radius:999px;width:34px;height:34px}.example{background:#f7f1df;border-radius:12px;padding:12px;margin-top:12px;font-size:12px;line-height:1.55}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.foot{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:26px}
@media(max-width:1000px){.hero{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.goals{grid-template-columns:repeat(3,minmax(0,1fr))}.categories,.decision-grid,.apps{grid-template-columns:repeat(2,minmax(0,1fr))}.checks{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:680px){.container{padding:16px}main{padding:28px 0}.kpis{grid-template-columns:1fr 1fr}.goals,.categories,.decision-grid,.apps,.video-grid,.checks,.two,.three,.four{grid-template-columns:1fr}.calc-top{grid-template-columns:1fr}.bar{grid-template-columns:1fr 50px}.bar .track{grid-column:1/3}.canvas-wrap canvas{height:210px}.option{min-width:100%}}

/* ====== Final interaction + layout polish ====== */
.goal-section{display:grid;gap:20px}
.calculator-shell{background:#f7f1df;border:1px solid #d7e4c4;border-radius:22px;padding:22px}
.calc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.calc-title{font-family:'Fraunces',serif;font-size:26px;line-height:1.1;margin:3px 0 5px}
.calc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.calc-control{background:#fffdf2;border:1px solid #dfe8d0;border-radius:16px;padding:15px;min-width:0}
.calc-control .control-head{min-height:30px}
.calc-control .value{font-size:22px}
.step-card{margin-top:14px;background:#fffdf2;border:1px solid #dfe8d0;border-radius:16px;padding:16px}
.step-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.step-choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.metric-card{padding:17px;border-radius:16px;background:#efe9d9;border:1px solid #e1dbc9;min-width:0}
.metric-card.highlight{background:#e5f2d4;border-color:#cde2ba}
.metric-card .num{font-family:'Fraunces',serif;font-size:30px;font-weight:700;margin-top:7px;letter-spacing:-.04em}
.chart-box{margin-top:16px;background:#fff;border:1px solid #dfe8d0;border-radius:16px;padding:12px;overflow:hidden}
.chart-box canvas{width:100%;height:230px;display:block}
.calc-note{margin-top:12px;font-size:11px;color:var(--muted);line-height:1.55}
.reset-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.scroll-cta{padding:16px 18px;margin-top:18px;border:1px dashed #9fc19a;border-radius:16px;background:#edf7e4;text-align:center}
.scroll-cta b{font-size:14px}
.categories{grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}
.category{height:100%;display:flex;flex-direction:column;text-align:left;cursor:pointer}
.category .category-actions{margin-top:auto;padding-top:12px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.category .fit-chip{font-size:10px;background:#f5f0e3;border-radius:999px;padding:6px 8px;color:var(--muted)}
.decision-grid{grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}
.decision{height:100%;display:flex;flex-direction:column;text-align:left;cursor:pointer}
.decision .decision-actions{margin-top:auto;padding-top:12px}
.checks{grid-template-columns:repeat(5,minmax(0,1fr));align-items:stretch}
.check{height:100%;text-align:left;cursor:pointer;transition:.12s}
.check:hover{border-color:var(--accent);transform:translateY(-2px)}
 .quiz-wrap{background:#fffdf2;border:2px solid var(--line);border-radius:20px;padding:22px}
.quiz-progress{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.quiz-progress-bar{height:6px;background:#e9e5d8;border-radius:999px;overflow:hidden;margin-bottom:22px}
.quiz-progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .2s ease}
.quiz-single{min-height:230px;display:flex;flex-direction:column;justify-content:center}
.quiz-complete{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.quiz-single .quiz-question{font-size:26px;margin:6px 0 18px}
.quiz-single .option-row{margin-top:4px}
.quiz-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.quiz-back{border:0;background:transparent;color:var(--muted);text-decoration:underline;padding:6px 0}
.quiz-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.quiz-step{padding:18px 0;border-bottom:1px solid var(--line)}
.quiz-step:first-child{padding-top:0}
.quiz-step:last-child{border-bottom:0;padding-bottom:0}
.quiz-label{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:11px}
.quiz-number{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.quiz-question{font-family:'Fraunces',serif;font-size:20px;line-height:1.25;margin-top:4px}
.option-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.option{min-width:0;min-height:56px;padding:12px;border:1.5px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);text-align:left;line-height:1.35}
.option.selected{border:2px solid var(--accent);background:var(--accent-soft)}
.quiz-skip{margin-top:8px;border:0;background:transparent;color:var(--muted);font-size:11px;text-decoration:underline;padding:4px 0}
.match-box{display:block;background:#e7f3d5;border:1px solid #cae0bb;padding:18px;border-radius:17px;margin-top:16px}
.match-app{background:#fffdf2;border:2px solid var(--accent);border-radius:18px;padding:19px}
.match-app-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.match-app h3{font-size:24px;margin:3px 0 4px}
.match-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.video-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px}
.video-card{border:1.5px solid var(--line);border-radius:16px;padding:16px;background:#fffdf2}
.video-card p{margin:5px 0 0}
.learn-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.category-note{background:#faf6e7;border:1px solid #ebe2cf;padding:10px 12px;border-radius:12px;font-size:11px;line-height:1.55;margin-top:10px}
.app-match-empty{background:#f7f1df;border:1px dashed #d5cdbb;border-radius:16px;padding:15px;color:var(--muted);font-size:12px;line-height:1.55}
.term.inline-term{margin-left:4px;position:relative;z-index:2}
.modal-card .source-note{font-size:11px;color:var(--muted);margin-top:12px}
@media(max-width:1000px){.calc-grid,.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.checks{grid-template-columns:repeat(3,minmax(0,1fr))}.categories,.decision-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.option-row{grid-template-columns:1fr}}
@media(max-width:680px){.calc-grid,.metric-grid,.categories,.decision-grid,.checks,.video-grid{grid-template-columns:1fr}.match-links,.learn-links{flex-direction:column}.match-links .btn,.learn-links .btn{width:100%}.quiz-question{font-size:18px}}

</style>
</head>
<body>
<div class="container">
<header class="top">
<button class="brand" onclick="showPage('home')"><span class="logo">f.</span>finlit</button>
<nav aria-label="Main navigation">
<button class="nav active" data-page="home">HOME</button>
<button class="nav" data-page="student">STUDENT</button>
<button class="nav" data-page="faculty">FACULTY</button>
<button class="nav" data-page="household">HOUSEHOLD</button>
</nav>
</header>
<main id="app"></main>
<footer class="foot"><span>FINLIT / EDUCATION FIRST</span><span>Educational prototype · Illustrative values only · Official links checked Sep 2026</span></footer>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle"></h3><button class="modal-close" onclick="closeModal()" aria-label="Close">×</button></div><div id="modalText"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const money=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const compact=n=>n>=10000000?'₹'+(n/10000000).toFixed(2)+' Cr':n>=100000?'₹'+(n/100000).toFixed(2)+' L':money(n);

const profiles={
 student:{title:'Start small. Build the habit.',sub:'Choose a goal, see what regular investing could look like, then learn how to start.',eyebrow:'STUDENT SPACE',amount:1000,years:10,goals:[['short','Short-term','Near-term goal','↗',1500,2],['education','Education','Study or skills','▤',2000,4],['travel','Travel','A future trip','✈',2000,3],['wealth','Long-term wealth','Build over time','◈',1000,10]]},
 faculty:{title:'Make your income work towards your goals',sub:'Explore long-term goals, retirement planning and how regular investing can fit into your income.',eyebrow:'FACULTY SPACE',amount:10000,years:20,goals:[['retirement','Retirement','Prepare for later','◷',10000,20],['wealth','Wealth creation','Long-term growth','◈',8000,15],['education','Children’s education','A future milestone','▤',7500,10],['home','Home','A major purchase','⌂',12000,10]]},
 household:{title:'Invest around your family’s goals',sub:'Different goals need different timelines. Explore them before deciding where to invest.',eyebrow:'HOUSEHOLD SPACE',amount:5000,years:15,goals:[['emergency','Emergency fund','Financial buffer','◇',5000,2],['education','Child’s education','A future milestone','▤',7000,12],['home','Home','A major purchase','⌂',10000,10],['retirement','Retirement','Long-term planning','◷',8000,20],['wealth','Long-term wealth','Build over time','◈',5000,15]]}
};

const terms={
 SIP:{title:'SIP — in simple words',text:'A SIP is a way of investing the same or planned amount regularly into a mutual fund. It is a method, not a separate investment product.',example:'If you put ₹1,000 into a mutual fund every month, that regular ₹1,000 payment is your SIP.'},
 Index:{title:'Index / passive fund',text:'This fund tries to follow a market index, such as the Nifty 50, instead of trying to pick individual winners.',example:'Think of it like buying a basket that follows the Nifty 50. If the index falls, the fund can fall too.'},
 Equity:{title:'Equity fund',text:'An equity fund invests mainly in company shares. Its value can move up and down, sometimes sharply.',example:'If the companies held by the fund lose value, your fund value can also fall. A longer time horizon matters.'},
 Flexi:{title:'Flexi-cap fund',text:'A flexi-cap fund is an equity category that can invest across large-, mid- and small-sized companies.',example:'The fund can hold a mix of big and smaller companies, with the mix changing over time.'},
 Hybrid:{title:'Hybrid fund',text:'A hybrid fund mixes equity and debt. The exact mix is different from one scheme to another.',example:'Imagine one basket holding both shares and bonds. The amount in each can vary by fund.'},
 Debt:{title:'Debt fund',text:'A debt fund invests mainly in bonds and other fixed-income securities. It is not risk-free.',example:'A bond is like lending money to a government or company; the fund holds many such securities.'},
 Liquid:{title:'Liquid fund',text:'A liquid fund is a debt-fund category used for short-term money management. It is not the same as a bank deposit.',example:'It can be studied for money you may need relatively soon, but returns are not guaranteed.'},
 Step:{title:'Step-up SIP',text:'A step-up SIP increases your SIP amount periodically, usually once a year.',example:'If you start at ₹2,000 a month and choose a 10% step-up, the next year becomes ₹2,200 a month.'},
 Riskometer:{title:'Riskometer',text:'The Riskometer is the standard risk label shown for a mutual-fund scheme. It helps you see the scheme’s stated risk level before investing.',example:'A higher risk label means larger ups and downs may be possible. It is not a promise about future returns.'},
 Expense:{title:'Expense ratio',text:'This is the fund’s annual operating cost, shown as a percentage of the fund’s assets.',example:'You do not normally get a separate bill for it; the cost is reflected in the fund’s returns.'},
 Exit:{title:'Exit load / lock-in',text:'Exit load is a possible fee for withdrawing early. A lock-in means you cannot freely withdraw for a stated period.',example:'Always check the exact scheme rules before investing because they differ by product.'},
 Portfolio:{title:'Portfolio',text:'A portfolio is simply what the fund currently owns — for example, shares or bonds.',example:'Looking at the portfolio helps you understand where your money is actually invested.'},
 Benchmark:{title:'Benchmark',text:'A benchmark is a reference point used to compare a fund’s performance.',example:'For a relevant equity fund, the benchmark might be a market index. You can ask how the fund performed against it.'},
 Diversification:{title:'Diversification',text:'Diversification means spreading money across different investments instead of concentrating everything in one place.',example:'A diversified fund can hold many companies, so you are not relying on a single company.'}
};

let page='home',profile='student',state={};

 flexi:{name:'Flexi-cap fund',tag:'Flexible equity',term:'Flexi',why:'It helps explain an equity category that can move across large-, mid- and small-sized companies.',text:'An equity category that can invest across different company sizes.',example:'The fund may hold big companies and smaller companies; the mix can change over time.',check:'Check portfolio concentration, Riskometer, costs and stated strategy.',learn:varsitMF},
 hybrid:{name:'Hybrid fund',tag:'Mix of equity + debt',term:'Hybrid',why:'It is shown to explain how combining assets can change risk.',text:'A fund that mixes equity and debt. The exact mix differs by scheme.',example:'Imagine a basket with both shares and bonds. The percentage in each depends on the fund.',check:'Check the actual equity/debt mix, Riskometer, portfolio and costs. Do not assume every hybrid fund has the same risk.',learn:varsitMF},
 debt:{name:'Debt fund',tag:'Mainly fixed-income',term:'Debt',why:'It is included for shorter horizons and to explain funds focused on bonds and other debt securities.',text:'A fund that invests mainly in bonds and other fixed-income securities.',example:'A bond is like lending money to a government or company; the fund holds many such securities.',check:'Check credit quality, duration, interest-rate risk, exit load and Riskometer.',learn:varsitMF},
 liquid:{name:'Liquid fund',tag:'Short-term money',term:'Liquid',why:'It appears for emergency or short-term goals because it is designed for short-term money management.',text:'A debt-fund category used for short-term money management.',example:'It may be studied for money you may need relatively soon, but it is not a guaranteed deposit.',check:'Check liquidity, portfolio, costs and the scheme Riskometer.',learn:varsitMF}
};
const decisionData={
 index:{title:'SIP into an index fund',what:'The SIP is the regular payment method. The index fund is the investment underneath it.',example:'₹1,000 every month into a fund that follows the Nifty 50 = ₹1,000 SIP + an index fund as the investment.',why:'It is shown as a simple way to learn about diversified equity exposure for longer goals.',check:'Check the index followed, expense ratio, tracking difference/error, portfolio and Riskometer.',learn:'https://zerodha.com/varsity/chapter/introduction-to-index-funds/'},
 flexi:{title:'SIP into a flexi-cap fund',what:'You invest regularly into an equity fund that can move across different company sizes.',example:'The SIP can stay ₹1,000 each month while the fund holds a mix of large-, mid- and small-sized companies.',why:'It helps explain a flexible equity category for longer horizons.',check:'Check portfolio concentration, Riskometer, benchmark, costs and stated strategy.',learn:varsitMF},
 hybrid:{title:'SIP into a hybrid fund',what:'You invest regularly into a fund that mixes equity and debt.',example:'Think of your monthly SIP going into a basket containing both shares and bonds. The mix depends on the fund.',why:'It helps explain how combining assets can change risk.',check:'Check the actual equity/debt mix, Riskometer, portfolio and costs.',learn:varsitMF},
 debt:{title:'SIP into a debt fund',what:'You invest regularly into a fund that mainly holds bonds and other fixed-income securities.',example:'₹1,000 each month goes into a debt fund, which then invests according to its stated strategy.',why:'It appears more often for shorter horizons or when learning about less equity-heavy options.',check:'Check credit quality, duration, interest-rate risk, exit load and Riskometer.',learn:varsitMF},
 elss:{title:'SIP into ELSS',what:'ELSS is an equity-linked savings scheme with a statutory 3-year lock-in. A SIP can be the way you invest into it.',example:'You invest ₹1,000 each month, but the statutory lock-in and current tax rules still apply.',why:'It can be useful to understand if tax-saving is part of the goal, but it is still equity-market linked.',check:'Confirm the 3-year statutory lock-in, current tax treatment, Riskometer, portfolio and costs.',learn:varsitMF}
};
function renderCategories(){const ids=categorySet();$('categoryBadge').textContent=`${state.years}-year view · ${money(state.amount)}/month`;$('categories').innerHTML=ids.map(id=>{const c=cats[id];return `<div class="category" role="button" tabindex="0" onclick="openCategory('${id}')" onkeydown="if(event.key==='Enter'||event.key===' ')openCategory('${id}')"><span class="tag">${c.tag}</span><h3>${c.name} ${q(c.term)}</h3><p>${c.text}</p><div class="mini"><b>Why it is here:</b> ${c.why}</div><div class="category-note"><b>Simple example:</b> ${c.example}</div><div class="category-actions"><span class="fit-chip">Goal + ${state.years} years</span><span class="small"><b>Tap to learn ↗</b></span></div></div>`}).join('')}
function renderDecisions(){let ids;if(state.goal==='emergency'||state.goal==='short')ids=['debt','hybrid'];else if(state.years<=3)ids=['debt','hybrid','elss'];else if(state.years<=7)ids=['index','hybrid','flexi','debt'];else ids=['index','flexi','hybrid'];$('decisions').innerHTML=ids.map(id=>{const d=decisionData[id];return `<button class="decision" onclick="openDecision('${id}')"><span class="risk">Learn / compare</span><h3 style="margin-top:12px">${d.title}</h3><p class="small muted">${d.what}</p><div class="mini"><b>Simple example:</b> ${d.example}</div><div class="decision-actions"><span class="btn" style="padding:8px 11px">Open explanation ↗</span></div></button>`}).join('')}
function openCategory(id){const c=cats[id];openCustom(c.name,`<p>${c.text}</p><div class="example"><b>Simple example</b><br>${c.example}</div><div class="example"><b>Why it appears here</b><br>${c.why} Your current illustration is <b>${money(state.amount)}/month for ${state.years} years</b>.</div><div class="example"><b>Before you compare a fund</b><br>${c.check}</div><div class="learn-links"><a class="btn green" href="${c.learn}" target="_blank" rel="noopener">Learn this on Varsity ↗</a></div><div class="source-note">Educational only — not a fund recommendation.</div>`)}
function openDecision(id){const d=decisionData[id];openCustom(d.title,`<p>${d.what}</p><div class="example"><b>Very simple example</b><br>${d.example}</div><div class="example"><b>Why it is showing for you</b><br>${d.why} Your current illustration is <b>${money(state.amount)}/month for ${state.years} years</b>.</div><div class="example"><b>What to check</b><br>${d.check}</div><div class="learn-links"><a class="btn green" href="${d.learn}" target="_blank" rel="noopener">Learn more on Varsity ↗</a></div>`)}
function openTerm(k){const t=terms[k];if(!t)return;openCustom(t.title,`<p>${t.text}</p><div class="example"><b>Simple example</b><br>${t.example}</div>`)}
function openCustom(title,html){$('modalTitle').textContent=title;$('modalText').innerHTML=html;$('modal').classList.remove('hidden');document.body.style.overflow='hidden'}
function closeModal(){$('modal').classList.add('hidden');document.body.style.overflow=''}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
showPage('home');

</script>
